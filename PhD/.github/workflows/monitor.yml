name: PhD Professor Hiring Monitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: phd-monitor
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Restore state database
        uses: actions/cache@v4
        with:
          path: phd-monitor/data/state.db
          key: state-db-${{ github.run_number }}
          restore-keys: state-db-

      - name: Run PhD monitor
        working-directory: phd-monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          LOG_LEVEL:          INFO
        run: python main.py

      - name: Save state database
        if: always()
        uses: actions/cache@v4
        with:
          path: phd-monitor/data/state.db
          key: state-db-${{ github.run_number }}

      - name: Upload alerts log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerts-log-${{ github.run_number }}
          path: phd-monitor/data/alerts_log.json
          retention-days: 90
          if-no-files-found: ignore
