# Strong signals — high confidence that professor is hiring PhD students
strong_signals:
  - "accepting phd applications"
  - "accepting phd students"
  - "looking for phd students"
  - "seeking phd students"
  - "phd positions available"
  - "phd position available"
  - "recruiting phd students"
  - "recruiting phd"
  - "hiring phd students"
  - "funded phd position"
  - "funded phd opening"
  - "openings for phd"
  - "opening for phd"
  - "prospective phd students"
  - "prospective students please"
  - "join my lab"
  - "join our lab"
  - "looking for motivated students"
  - "seeking motivated phd"
  - "phd fellowship available"
  - "applications for fall 202"
  - "apply to work with me"
  - "i am recruiting"
  - "we are recruiting"
  - "phd openings"
  - "multiple phd openings"
  - "fully funded phd"
  - "i will be taking phd"
  - "taking new phd students"
  - "interested in joining"
  - "phd student wanted"
  - "now recruiting"
  - "actively recruiting"

# Weak signals — need 2 or more to trigger, lower confidence
weak_signals:
  - "research opportunities"
  - "strong applicants"
  - "motivated students"
  - "graduate students"
  - "phd applications"
  - "fall 2026"
  - "fall 2027"
  - "new students"
  - "graduate admissions"
  - "phd program"
  - "interested students"
  - "email me"
  - "reach out"
  - "contact me"
  - "apply now"

# Negative filters — ignore these to reduce false positives
negative_filters:
  - "congrats to my phd student"
  - "my student defended"
  - "phd comic"
  - "phd dissertation"
  - "my phd thesis"
  - "i defended"
  - "passed their defense"
  - "completed their phd"
  - "earned their phd"
  - "graduated from"
  - "postdoc position"
  - "postdoctoral position"
  - "faculty position"
  - "faculty opening"
  - "tenure track"
  - "internship position"
  - "summer internship"
  - "research internship"
